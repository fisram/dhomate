[versions]
agp = "9.3.2"
kotlin = "2.4.10"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
wear = "1.4.0"
wearOngoing = "1.1.0"
wearCompose = "1.6.2"
tiles = "1.6.2"
protolayout = "1.4.2"
complications = "1.3.0"
datastore = "1.2.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
concurrentFutures = "1.3.0"
profileInstaller = "1.4.1"

[libraries]
core-ktx              = { group = "androidx.core",      name = "core-ktx",              version.ref = "coreKtx" }
activity-compose      = { group = "androidx.activity",  name = "activity-compose",      version.ref = "activityCompose" }
coroutines-android    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences",  version.ref = "datastore" }
concurrent-futures       = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "concurrentFutures" }
profileinstaller         = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }

lifecycle-runtime-compose  = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",  version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom       = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui        = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

wear              = { group = "androidx.wear", name = "wear",         version.ref = "wear" }
wear-ongoing      = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }
wear-compose-material3  = { group = "androidx.wear.compose", name = "compose-material3",  version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }

tiles                  = { group = "androidx.wear.tiles", name = "tiles",                  version.ref = "tiles" }
tiles-tooling          = { group = "androidx.wear.tiles", name = "tiles-tooling",          version.ref = "tiles" }
tiles-tooling-preview  = { group = "androidx.wear.tiles", name = "tiles-tooling-preview",  version.ref = "tiles" }
protolayout            = { group = "androidx.wear.protolayout", name = "protolayout",            version.ref = "protolayout" }
protolayout-material3  = { group = "androidx.wear.protolayout", name = "protolayout-material3",  version.ref = "protolayout" }
protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "protolayout" }

complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "complications" }

[plugins]
android-application = { id = "com.android.application",            version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
